<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경영회의 자료 뷰어</title>
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">대외비</span>
      <h1>경영회의 자료</h1>
    </div>

    <label class="upload-btn" for="upload-input">
      <span class="plus">＋</span> 경영회의 자료 업로드
    </label>
    <input id="upload-input" type="file" accept="application/pdf" hidden>
    <p class="upload-hint">PDF 파일만 업로드할 수 있습니다. 업로드한 파일은 이 서버(이 PC)에 저장되며, 같은 네트워크에서 접속한 모든 사람에게 보입니다.</p>

    <div class="report-list-wrap">
      <h2>월별 자료 목록</h2>
      <ul id="report-list" class="report-list"></ul>
    </div>
  </aside>

  <main class="viewer">
    <div class="viewer-toolbar">
      <div class="toolbar-left">
        <button id="sidebar-toggle" title="메뉴 숨기기/보이기" class="icon-btn">☰</button>
        <div class="doc-title" id="doc-title">자료를 선택하세요</div>
      </div>
      <div class="toolbar-controls">
        <button id="zoom-out" title="축소">－</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in" title="확대">＋</button>
        <span class="divider"></span>
        <button id="prev-page" title="이전 페이지">↑ 이전</button>
        <span id="page-indicator">- / -</span>
        <button id="next-page" title="다음 페이지">다음 ↓</button>
        <span class="divider"></span>
        <button id="delete-report" title="이 업로드 자료 삭제" hidden>삭제</button>
      </div>
    </div>
    <div class="viewer-scroll" id="viewer-scroll">
      <div class="empty-state" id="empty-state">
        <p>왼쪽 목록에서 경영회의 자료를 선택하거나,<br>이번 달 자료를 업로드해 주세요.</p>
      </div>
      <div id="pages-container"></div>
    </div>
  </main>
</div>

<button id="chat-fab" class="chat-fab" title="이 달 자료에 대해 질문하기">💬</button>

<div id="chat-panel" class="chat-panel" hidden>
  <div class="chat-panel-header">
    <span id="chat-panel-title">이 달 자료에 대해 질문하기</span>
    <button id="chat-panel-close" class="icon-btn" title="닫기">✕</button>
  </div>
  <div id="chat-messages" class="chat-messages"></div>
  <div class="chat-input-row">
    <textarea id="chat-input" class="chat-input" rows="1" placeholder="예: 이번 달 매출 실적이 얼마였어?"></textarea>
    <button id="chat-send" class="chat-send-btn">보내기</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js?v=14"></script>
</body>
</html>
